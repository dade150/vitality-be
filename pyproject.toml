[project]
name = "vitality-be"
version = "0.2.0"
description = "Backend Vitality Assist"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "supabase>=2.10",
    "google-genai>=2.30,<3",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.1",
    "fonttools>=4.67.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitality_be"]  # include anche llm/prompts/*.md

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
